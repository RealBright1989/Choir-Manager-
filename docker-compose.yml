version: "3.9"

services:
  web:
    build: .
    container_name: choir-manager
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:-choir-fixed-secret-key-2026-eton-natural}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE=${TWILIO_PHONE:-}
    restart: unless-stopped

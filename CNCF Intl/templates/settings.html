{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h2>Settings</h2>
        <p>System configuration</p>
    </div>
</div>

<div class="card" style="max-width:700px;">
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label>Organization Name</label>
                <input type="text" name="org_name" value="{{ settings.get('org_name', 'BCS CNCF International') }}">
            </div>
            <div class="form-group">
                <label>Choir Name</label>
                <input type="text" name="choir_name" value="{{ settings.get('choir_name', 'BCS CNCF International Choir') }}">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Rehearsal Day</label>
                    <select name="rehearsal_day">
                        {% for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] %}
                        <option value="{{ d }}" {{ 'selected' if settings.get('rehearsal_day') == d }}>{{ d }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Rehearsal Time</label>
                    <input type="text" name="rehearsal_time" value="{{ settings.get('rehearsal_time', '16:00') }}">
                </div>
            </div>
            <div style="margin-top:8px;">
                <button type="submit" class="btn btn-primary">
                    <span class="material-symbols-outlined" style="font-size:18px;">save</span> Save Settings
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

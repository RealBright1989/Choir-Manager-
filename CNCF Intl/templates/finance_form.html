{% extends "base.html" %}
{% block title %}Record Transaction{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="breadcrumb">
            <a href="{{ url_for('finance.list') }}" style="color:var(--outline);text-decoration:none;">Finance</a>
            <span class="material-symbols-outlined" style="font-size:14px;">chevron_right</span>
            <span class="current">Record Transaction</span>
        </div>
        <h2>Record Transaction</h2>
    </div>
</div>

<div class="card" style="max-width:600px;">
    <div class="card-body">
        <form method="POST" action="{{ url_for('finance.add') }}">
            <div class="form-row">
                <div class="form-group">
                    <label>Type *</label>
                    <select name="type" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount *</label>
                    <input type="number" name="amount" step="0.01" required placeholder="0.00">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Date *</label>
                    <input type="date" name="date" value="{{ now().strftime('%Y-%m-%d') }}" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select name="category">
                        <option value="">Select...</option>
                        <option value="Offering">Offering</option>
                        <option value="Tithe">Tithe</option>
                        <option value="Donation">Donation</option>
                        <option value="Transport">Transport</option>
                        <option value="Equipment">Equipment</option>
                        <option value="Refreshment">Refreshment</option>
                        <option value="Uniform">Uniform</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" name="description">
            </div>
            <div style="display:flex;gap:12px;">
                <button type="submit" class="btn btn-primary">
                    <span class="material-symbols-outlined" style="font-size:18px;">save</span> Record
                </button>
                <a href="{{ url_for('finance.list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

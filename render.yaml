services:
  - type: web
    name: choir-manager
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 5000
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: choir-db
          property: connectionString

databases:
  - name: choir-db
    plan: free
    databaseName: choir
    ipAllowList: []

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ settings.choir_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .login-left {
            flex: 1;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            height: 100vh;
            position: sticky;
            top: 0;
            padding: 60px;
        }

        .login-left img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-right {
            width: 460px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: #fff;
            min-height: 100vh;
            overflow-y: auto;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
        }

        .login-card .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-card .brand img {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 8px;
        }

        .login-card .brand h2 {
            font-size: 20px;
            color: #1a1a2e;
            margin: 0;
        }

        .login-card .brand p {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        .login-card label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        .login-card input[type="text"],
        .login-card input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .login-card input:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
        }

        .login-card .btn-login {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
            transition: background 0.2s;
        }

        .login-card .btn-login:hover { background: #d63850; }

        .login-card .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .login-card .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .login-card .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .login-card .back-link {
            text-align: center;
            margin-top: 16px;
        }

        .login-card .back-link a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

        .login-card .back-link a:hover { color: #e94560; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .login-left { display: none; }
            .login-right { width: 100%; padding: 30px 20px; min-height: auto; }
        }
    </style>
</head>
<body>
    <div class="login-left">
        <img id="slideShow" src="{{ url_for('static', filename='slide1.jpeg') }}" alt="Choir" style="object-fit:contain;width:100%;height:auto;max-height:80vh;transition:opacity 0.8s;border-radius:16px;">
    </div>
    <script>
    const slides = (function() {
        const imgs = [];
        for (let i = 1; i <= 5; i++) imgs.push("{{ url_for('static', filename='slide') }}" + i + ".jpeg");
        return imgs;
    })();
    let slideIdx = 0;
    setInterval(function() {
        slideIdx = (slideIdx + 1) % slides.length;
        const img = document.getElementById('slideShow');
        img.style.opacity = '0';
        setTimeout(function() {
            img.src = slides[slideIdx];
            img.style.opacity = '1';
        }, 400);
    }, 4000);
    </script>

    <div class="login-right">
        <div class="login-card">
            <div class="brand">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
                <h2>{{ settings.choir_name }}</h2>
                <p>Management System</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, msg in messages %}
            <div class="alert alert-{{ category }}">{{ msg }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">
                <label>Username</label>
                <input type="text" name="username" required autofocus>

                <label>Password</label>
                <input type="password" name="password" required>

                <label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;font-size:13px;color:#666;margin-top:12px;">
                    <input type="checkbox" id="agreeTerms" onchange="document.getElementById('loginBtn').disabled=!this.checked" style="margin-top:2px;width:15px;height:15px;accent-color:#e94560;">
                    <span>I agree to the <a href="{{ url_for('landing.terms') }}" style="color:#e94560;text-decoration:underline;">Terms of Service</a></span>
                </label>

                <input type="hidden" name="csrf_token" value="{{ csrf() }}">

                <button type="submit" id="loginBtn" class="btn-login" disabled>Sign In</button>
            </form>

            <div style="text-align:center;margin-top:14px;">
                <a href="{{ url_for('auth.forgot_password') }}" style="color:#888;font-size:13px;text-decoration:none;">Forgot password?</a>
            </div>

            <div class="back-link">
                <a href="{{ url_for('landing.landing') }}">&larr; Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>

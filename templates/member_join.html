<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join {{ settings.choir_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='lga_data.js') }}"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .join-left {
            flex: 1;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            height: 100vh;
            position: sticky;
            top: 0;
            padding: 60px;
        }

        .join-left img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .join-right {
            width: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: #fff;
            min-height: 100vh;
            overflow-y: auto;
        }

        .join-card {
            width: 100%;
            max-width: 440px;
        }

        .join-card .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .join-card .brand img {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 8px;
        }

        .join-card .brand h2 {
            font-size: 20px;
            color: #1a1a2e;
            margin: 0;
        }

        .join-card .brand p {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        .join-card .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .join-card label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 4px;
            margin-top: 12px;
        }

        .join-card input, .join-card select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .join-card input:focus, .join-card select:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
        }

        .join-card .btn-join {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .join-card .btn-join:hover { background: #d63850; }

        .join-card .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .join-card .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .join-card .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .join-card .footer-links {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #888;
        }

        .join-card .footer-links a { color: #e94560; text-decoration: none; }
        .join-card .footer-links a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .join-left { display: none; }
            .join-right { width: 100%; padding: 30px 20px; min-height: auto; }
            .join-card .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="join-left">
        <img id="slideJoin" src="{{ url_for('static', filename='slide1.jpeg') }}" alt="Choir" style="object-fit:contain;width:100%;height:auto;max-height:80vh;transition:opacity 0.8s;border-radius:16px;">
    </div>
    <script>
    (function() {
        const slides = [];
        for (let i = 1; i <= 5; i++) slides.push("{{ url_for('static', filename='slide') }}" + i + ".jpeg");
        let idx = 0;
        setInterval(function() {
            idx = (idx + 1) % slides.length;
            const img = document.getElementById('slideJoin');
            img.style.opacity = '0';
            setTimeout(function() { img.src = slides[idx]; img.style.opacity = '1'; }, 400);
        }, 4000);
    })();
    </script>

<script>
function toggleCountryFields() {
    const country = document.getElementById('countryInput').value;
    const nigeriaFields = document.getElementById('nigeriaFields');
    const internationalFields = document.getElementById('internationalFields');
    const stateSelect = document.getElementById('stateSelect');
    const lgaSelect = document.getElementById('lgaSelect');

    const ninNigeria = document.getElementById('ninNigeria');
    if (country === '' || country === 'Nigeria') {
        nigeriaFields.style.display = '';
        internationalFields.style.display = 'none';
        stateSelect.required = true;
        lgaSelect.required = true;
        if (ninNigeria) ninNigeria.required = true;
    } else {
        nigeriaFields.style.display = 'none';
        internationalFields.style.display = '';
        stateSelect.required = false;
        lgaSelect.required = false;
        if (ninNigeria) ninNigeria.required = false;
    }
}

document.addEventListener('DOMContentLoaded', toggleCountryFields);

function updateLGAs() {
    const state = document.getElementById('stateSelect').value;
    const lgaSelect = document.getElementById('lgaSelect');
    lgaSelect.innerHTML = '<option value="">Select LGA...</option>';
    if (state && NIGERIA_LGAS[state]) {
        NIGERIA_LGAS[state].forEach(lga => {
            const opt = document.createElement('option');
            opt.value = lga;
            opt.textContent = lga;
            lgaSelect.appendChild(opt);
        });
    }
}

// ─── Phone OTP Verification ───
const phoneInput = document.getElementById('phoneInput');
const otpSection = document.getElementById('otpSection');
const sendOtpBtn = document.getElementById('sendOtpBtn');
const verifyOtpBtn = document.getElementById('verifyOtpBtn');
const otpInput = document.getElementById('otpInput');
const otpStatus = document.getElementById('otpStatus');
const phoneVerified = document.getElementById('phoneVerified');
const submitBtn = document.getElementById('submitBtn');

let phoneVerifiedFlag = false;

phoneInput.addEventListener('input', function() {
    if (this.value.trim().length >= 10) {
        otpSection.style.display = 'block';
    } else {
        otpSection.style.display = 'none';
        phoneVerifiedFlag = false;
        submitBtn.disabled = true;
    }
});

sendOtpBtn.addEventListener('click', function() {
    const phone = phoneInput.value.trim();
    if (!phone) { otpStatus.textContent = 'Enter a phone number'; return; }
    otpStatus.textContent = 'Sending...';
    sendOtpBtn.disabled = true;

    const formData = new FormData();
    formData.append('phone', phone);

    fetch('/join/send-otp', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(data => {
            if (data.ok) {
                otpStatus.textContent = 'OTP sent! Check your phone (or server console in dev mode).';
                otpStatus.style.color = '#16a085';
            } else {
                otpStatus.textContent = data.error || 'Failed to send OTP';
                otpStatus.style.color = '#e74c3c';
                sendOtpBtn.disabled = false;
            }
        })
        .catch(() => {
            otpStatus.textContent = 'Network error';
            otpStatus.style.color = '#e74c3c';
            sendOtpBtn.disabled = false;
        });
});

verifyOtpBtn.addEventListener('click', function() {
    const phone = phoneInput.value.trim();
    const otp = otpInput.value.trim();
    if (!otp) { otpStatus.textContent = 'Enter the OTP code'; return; }
    otpStatus.textContent = 'Verifying...';
    verifyOtpBtn.disabled = true;

    const formData = new FormData();
    formData.append('phone', phone);
    formData.append('otp', otp);

    fetch('/join/verify-otp', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(data => {
            if (data.ok) {
                otpStatus.textContent = 'Phone verified!';
                otpStatus.style.color = '#16a085';
                phoneVerifiedFlag = true;
                phoneVerified.value = '1';
                submitBtn.disabled = false;
                sendOtpBtn.disabled = true;
                otpInput.disabled = true;
                verifyOtpBtn.disabled = true;
            } else {
                otpStatus.textContent = data.error || 'Invalid OTP';
                otpStatus.style.color = '#e74c3c';
                verifyOtpBtn.disabled = false;
            }
        })
        .catch(() => {
            otpStatus.textContent = 'Network error';
            otpStatus.style.color = '#e74c3c';
            verifyOtpBtn.disabled = false;
        });
});
</script>
</html>

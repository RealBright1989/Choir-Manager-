<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - {{ settings.choir_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fc; }
        .card { width: 100%; max-width: 400px; padding: 40px; background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .card h2 { font-size: 20px; color: #1a1a2e; text-align: center; margin-bottom: 6px; }
        .card p { font-size: 13px; color: #888; text-align: center; margin-bottom: 24px; }
        .card label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
        .card input[type="text"] { width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .card input:focus { outline: none; border-color: #e94560; box-shadow: 0 0 0 3px rgba(233,69,96,0.1); }
        .card .btn { width: 100%; padding: 12px; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .card .btn:hover { background: #d63850; }
        .card .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .card .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .card .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .card .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .card .back-link { text-align: center; margin-top: 16px; }
        .card .back-link a { color: #888; text-decoration: none; font-size: 13px; }
        .card .back-link a:hover { color: #e94560; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Forgot Password</h2>
        <p>Enter your username to receive a reset link.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, msg in messages %}
        <div class="alert alert-{{ category }}">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required autofocus>
            <input type="hidden" name="csrf_token" value="{{ csrf() }}">
            <button type="submit" class="btn">Send Reset Link</button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('auth.login') }}">&larr; Back to Login</a>
        </div>
    </div>
</body>
</html>

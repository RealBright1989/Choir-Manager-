{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>{% if invoice %}Edit Invoice{% else %}New Invoice{% endif %}</h1>
</div>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf() }}">
    <div class="card" style="padding:24px;margin-bottom:20px;">
        <h3 style="margin-bottom:16px;">Invoice Details</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div>
                <label>Member *</label>
                <select name="member_id" required>
                    <option value="">Select member...</option>
                    {% for m in members %}
                    <option value="{{ m.id }}" {% if invoice and invoice.member_id == m.id %}selected{% endif %}>{{ m.first_name }} {{ m.last_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Issue Date *</label>
                <input type="date" name="issue_date" value="{{ invoice.issue_date if invoice else '' }}" required>
            </div>
            <div>
                <label>Due Date *</label>
                <input type="date" name="due_date" value="{{ invoice.due_date if invoice else '' }}" required>
            </div>
            <div>
                <label>Notes</label>
                <input type="text" name="notes" value="{{ invoice.notes if invoice else '' }}" placeholder="Optional notes">
            </div>
        </div>
    </div>

    <div class="card" style="padding:24px;margin-bottom:20px;">
        <h3 style="margin-bottom:16px;">Invoice Items</h3>
        <div id="itemsContainer">
            <div class="item-row" style="display:grid;grid-template-columns:3fr 1fr 1fr 1fr 40px;gap:8px;margin-bottom:8px;align-items:end;">
                <div><label>Description</label></div>
                <div><label>Qty</label></div>
                <div><label>Unit Price</label></div>
                <div><label>Amount</label></div>
                <div></div>
            </div>
        </div>
        <button type="button" onclick="addItem()" class="btn btn-secondary btn-sm" style="margin-top:8px;">+ Add Item</button>
    </div>

    <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">Create Invoice</button>
        <a href="{{ url_for('invoices.invoices') }}" class="btn btn-outline">Cancel</a>
    </div>
</form>

<script>
let rowCount = 0;
function addItem(desc, qty, price) {
    rowCount++;
    const c = document.getElementById('itemsContainer');
    const d = document.createElement('div');
    d.className = 'item-row';
    d.style.cssText = 'display:grid;grid-template-columns:3fr 1fr 1fr 1fr 40px;gap:8px;margin-bottom:8px;align-items:center;';
    d.innerHTML = `
        <input type="text" name="item_description[]" value="${desc||''}" placeholder="Item description" required>
        <input type="number" name="item_quantity[]" value="${qty||1}" min="1" onchange="calcRow(this)" required>
        <input type="number" name="item_unit_price[]" value="${price||0}" min="0" step="0.01" onchange="calcRow(this)" required>
        <input type="text" readonly style="background:#f5f5f5;font-weight:600;">
        <button type="button" onclick="this.parentElement.remove()" style="background:none;border:none;color:#e94560;cursor:pointer;font-size:18px;">&times;</button>
    `;
    c.appendChild(d);
}
function calcRow(el) {
    const row = el.closest('.item-row');
    const qty = row.querySelector('[name="item_quantity[]"]').value || 0;
    const price = row.querySelector('[name="item_unit_price[]"]').value || 0;
    const amt = row.querySelectorAll('input[type="text"]')[0];
    if (amt) amt.value = (parseFloat(qty) * parseFloat(price)).toFixed(2);
}
addItem();
</script>
{% endblock %}
